# qpm-thoughtline SPA:静态资源长缓存,入口不缓存,history 回退
server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# 带 hash 的构建产物:内容不变即可永久缓存
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# 入口与回退:永不缓存,保证发版即生效
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
