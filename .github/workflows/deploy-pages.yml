name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只保留一次部署；新推送会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 有权限时自动启用 Pages（Source: GitHub Actions）；失败时按文档手动设置
          enablement: true
      # 项目页部署在 https://<owner>.github.io/<repo>/ 下，构建时注入仓库名作为 Vite base。
      # 用户/组织主页仓库（<owner>.github.io）请删除 BASE_PATH 一行改用默认根路径。
      - name: Build web bundle
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
